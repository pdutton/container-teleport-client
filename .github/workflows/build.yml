name: build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# Cancel superseded pull-request runs, but let a master push finish -- a
# cancellation mid-push would leave the tag set half-updated in the registry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    # One runner per architecture rather than one runner emulating both (D15).
    # ubuntu-24.04-arm is free for public repositories, which this is (M6), so
    # arm64 costs nothing and pull requests get native arm64 coverage they did
    # not have before. A local `make build` still does both under qemu; the
    # Makefile targets invoked are the same ones either way.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Two variants per runner, and the variants diverge at exactly the layer
    # podman's cache would otherwise reuse, so the 217 MB tarball is still
    # pulled twice per job. Both architectures now run in parallel, so this is
    # the same wall-clock budget as the single job it replaces.
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # v7 runs on Node.js 24. v4 targets Node.js 20, which is deprecated, and
      # the runner forces it onto 24 anyway while warning on every job.
      - uses: actions/checkout@v7

      # Default checkout depth is fine: the Makefile's `git rev-parse HEAD`
      # works at depth 1.

      - name: Ensure podman
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          # Resolve the tools from PATH and hand the results to make, rather
          # than asserting they sit at the Makefile's default absolute paths.
          #
          # This step used to run `test -x /usr/bin/podman`. That broke on
          # 2026-08-13, when the ubuntu-24.04 runner image moved podman off
          # /usr/bin as it went from 4.9.3 to 5.8.4 (image release
          # 20260810.271). During the rollout, jobs landed on either image, so
          # the same commit passed or failed depending on which runner it drew
          # -- and it would have failed every time once the rollout finished.
          #
          # The absolute path was never load-bearing here: the Makefile takes
          # PODMAN and AWK as overridable variables precisely so a caller can
          # say where its tools are. CI is such a caller, and now says so.
          PODMAN="$(command -v podman)"
          AWK="$(command -v awk)"
          test -n "$PODMAN" || { echo "ERROR: podman not on PATH after install" >&2; exit 1; }
          test -n "$AWK"    || { echo "ERROR: awk not on PATH" >&2; exit 1; }
          echo "PODMAN=$PODMAN" >> "$GITHUB_ENV"
          echo "AWK=$AWK"       >> "$GITHUB_ENV"
          echo "Using podman at $PODMAN, awk at $AWK"
          "$PODMAN" --version

      # Publishing happens only from master. A dispatch against another branch
      # still builds and smoke-tests, so a branch can be put through CI, but it
      # must never overwrite the shared mutable tags with unreviewed code. This
      # condition is the exact negation of the publish condition below.
      - name: Build and smoke-test
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
        run: make PODMAN="$PODMAN" AWK="$AWK" test-arch ARCH=${{ matrix.arch }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | podman login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      # One make invocation with two goals, run in order: test-arch takes
      # build-arch as a prerequisite, and push-arch deliberately does not depend
      # on test-arch, so this builds, smoke-tests, then publishes this
      # architecture's two images. The manifest lists are not this job's to
      # write -- the other architecture's images do not exist here.
      - name: Build, smoke-test, and push this architecture
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: make PODMAN="$PODMAN" AWK="$AWK" test-arch push-arch ARCH=${{ matrix.arch }}

      # The manifest job has no image to read the version off, so it comes from
      # here -- read back out of the built image exactly as a local `make
      # manifests` would, so no hand-typed version reaches the tag derivation
      # (D9, D15). Only the amd64 leg sets it: both legs would write the same
      # value, but matrix outputs are last-writer-wins and one deterministic
      # writer is worth more than a redundant second.
      - name: Report the built version
        id: version
        if: matrix.arch == 'amd64' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          v=$("$PODMAN" image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}' \
            localhost/teleport-client:latest-amd64)
          test -n "$v" || { echo "ERROR: no version label on latest-amd64" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Built version $v"

  # The two architectures were built by different runners and only meet in the
  # registry, so the lists are assembled from registry references
  # (MANIFEST_SRC) rather than from local storage. Same Makefile targets a local
  # `make push` runs -- only the two inputs D15 names differ.
  manifest:
    name: manifest lists
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    # No image build here: this pulls two manifests and pushes ten small lists.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Ensure podman
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          PODMAN="$(command -v podman)"
          AWK="$(command -v awk)"
          test -n "$PODMAN" || { echo "ERROR: podman not on PATH after install" >&2; exit 1; }
          test -n "$AWK"    || { echo "ERROR: awk not on PATH" >&2; exit 1; }
          echo "PODMAN=$PODMAN" >> "$GITHUB_ENV"
          echo "AWK=$AWK"       >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | podman login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      # VERSION is passed to both invocations because this runner has no local
      # image for the fallback readback in push-manifest-variant to inspect.
      # MANIFEST_SRC is spelled out rather than reusing $(REGISTRY)/$(IMAGE)
      # because the workflow cannot expand make variables; if REGISTRY is ever
      # changed in the Makefile, this line has to change with it.
      - name: Assemble and push the manifest lists
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -n "$VERSION" || { echo "ERROR: the build job reported no version" >&2; exit 1; }
          make PODMAN="$PODMAN" AWK="$AWK" manifests \
            VERSION="$VERSION" MANIFEST_SRC=docker.io/pdutton/teleport-client
          make PODMAN="$PODMAN" AWK="$AWK" push-manifests VERSION="$VERSION"

  # Docker Hub reads nothing from this repo on its own, so the overview page
  # would drift from DOCKERHUB-OVERVIEW.md the moment either is edited alone.
  # Same master-only guard as the publish steps: the page is synced after the
  # manifest lists are published, not after the images, since the lists are
  # the last thing a consumer of this repo actually pulls.
  description:
    name: dockerhub-description
    runs-on: ubuntu-latest
    needs: manifest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    # Just a checkout and a third-party action call; a hang here has no large
    # transfer to justify a long wait.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # The short description is set here too, so the whole Hub page is
      # declarative -- leaving it unset would silently preserve whatever was
      # last typed into the web UI.
      # Pinned by SHA, not by tag: this is the only third-party action here and
      # it is handed a Docker Hub token with write/delete scope. A tag is a
      # mutable pointer in someone else's repository -- repointing v5 would run
      # new code against that secret with no change on this side.
      # actions/checkout stays on a major tag; it is inside GitHub's own trust
      # boundary.
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: pdutton/teleport-client
          readme-filepath: ./DOCKERHUB-OVERVIEW.md
          # Docker Hub caps this at 100 characters and truncates silently past
          # it, so this stays well short rather than spending the budget on
          # "without installing it" -- which the overview body says anyway.
          short-description: "Teleport Community Edition tsh client, ready to run; tctl on the admin tag"
